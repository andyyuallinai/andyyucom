<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andy Yu Personal Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Cormorant Garamond', 'serif'],
              display: ['Cinzel', 'serif'],
            },
            colors: {
              'ink-black': '#1a1a1a',
              'paper-white': '#fdfbf7', // Slightly warm japanese paper white
              'charcoal': '#333333',
              'muted-gray': '#888888',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #fdfbf7;
        color: #1a1a1a;
        font-family: 'Cormorant Garamond', serif;
      }
      /* Custom scrollbar for minimalist look */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e5e5e5;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d4d4d4;
      }
      .fade-in {
        animation: fadeIn 0.8s ease-in-out;
      }
      /* Chinese font stacks matching globalcrisisindex.co.uk (Songti serif / PingFang sans).
         English keeps the site's own fonts untouched. */
      html[data-lang="zh"] body,
      html[data-lang="zh"] .font-serif {
        font-family: 'Cormorant Garamond', 'Songti SC', 'Songti TC', Georgia, serif;
      }
      html[data-lang="zt"] body,
      html[data-lang="zt"] .font-serif {
        font-family: 'Cormorant Garamond', 'Songti TC', 'Songti SC', Georgia, serif;
      }
      html[data-lang="zh"] .font-sans {
        font-family: 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans', system-ui, sans-serif;
      }
      html[data-lang="zt"] .font-sans {
        font-family: 'Inter', 'PingFang TC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft JhengHei', 'Noto Sans', system-ui, sans-serif;
      }
      html[data-lang="zh"] .font-display {
        font-family: 'Cinzel', 'Songti SC', 'Songti TC', serif;
      }
      html[data-lang="zt"] .font-display {
        font-family: 'Cinzel', 'Songti TC', 'Songti SC', serif;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
